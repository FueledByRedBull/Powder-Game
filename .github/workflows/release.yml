name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows Release Bundle
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $outDir = "dist/win11/PowderGame"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exe = Get-ChildItem build -Recurse -Filter "powder_game.exe" | Select-Object -First 1
          if (-not $exe) { throw "powder_game.exe not found" }

          $shaderDir = Join-Path $exe.Directory.FullName "shaders"
          if (-not (Test-Path $shaderDir)) { throw "shaders directory not found next to executable" }

          Copy-Item $exe.FullName (Join-Path $outDir "powder_game.exe") -Force
          Get-Content (Join-Path $exe.Directory.FullName "runtime-dlls.txt") | Where-Object { $_ } | ForEach-Object {
            Copy-Item -LiteralPath $_ -Destination $outDir -Force
          }
          Copy-Item $shaderDir (Join-Path $outDir "shaders") -Recurse -Force
          Copy-Item LICENSE $outDir
          $licenseDir = Join-Path $outDir "licenses"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item build/_deps/glfw-src/LICENSE.md (Join-Path $licenseDir "GLFW-LICENSE.md")
          Copy-Item build/_deps/glad_src-src/LICENSE (Join-Path $licenseDir "GLAD-LICENSE") -Recurse
          Copy-Item build/_deps/glad_src-src/glad/files/khrplatform.h $licenseDir

          $readme = @(
            "Powder Game $env:GITHUB_REF_NAME (Windows 11 x64)",
            "",
            "Run:",
            "- Double-click powder_game.exe",
            "",
            "Controls:",
            "- 1: Sand brush",
            "- 2: Water brush",
            "- 3: Solid brush",
            "- 4: Erase brush",
            "- 5: Smoke brush",
            "- 6: Fire brush",
            "- [ / ]: Decrease / increase brush radius",
            "- Left mouse: paint",
            "- Esc: quit",
            "",
            "Notes:",
            "- Keep the shaders/ folder and DLLs next to powder_game.exe.",
            "- Requires OpenGL 4.3+ and the resource limits listed in the source README.",
            "- See the release notes and source VALIDATION.md for measured limitations."
          )
          $readme | Set-Content -Path (Join-Path $outDir "README.txt")

          New-Item -ItemType Directory -Force -Path "dist/win11" | Out-Null
          $binaryZip = "dist/win11/PowderGame-$env:GITHUB_REF_NAME-win11-x64.zip"
          $sourceZip = "dist/win11/PowderGame-$env:GITHUB_REF_NAME-source.zip"
          Compress-Archive -Path "$outDir/*" -DestinationPath $binaryZip -Force
          git archive --format=zip --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed with exit $LASTEXITCODE" }
          @($binaryZip, $sourceZip) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Set-Content -Encoding utf8NoBOM "dist/win11/SHA256SUMS.txt"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/win11/PowderGame-${{ github.ref_name }}-win11-x64.zip
            dist/win11/PowderGame-${{ github.ref_name }}-source.zip
            dist/win11/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
