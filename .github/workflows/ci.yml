name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            python3 \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Config tests
        run: ctest --test-dir build -R '^config-parsing$' --output-on-failure

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Config tests
        run: ctest --test-dir build -C Release -R '^config-parsing$' --output-on-failure

      - name: Package Win11 artifact
        shell: pwsh
        run: |
          $outDir = "dist/win11/PowderGame"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exe = Get-ChildItem build -Recurse -Filter "powder_game.exe" | Select-Object -First 1
          if (-not $exe) { throw "powder_game.exe not found" }

          Copy-Item $exe.FullName (Join-Path $outDir "powder_game.exe") -Force

          Copy-Item packaging/README.txt (Join-Path $outDir "README.txt")

          New-Item -ItemType Directory -Force -Path "dist/win11" | Out-Null
          Compress-Archive -Path "$outDir/*" -DestinationPath "dist/win11/PowderGame-win11-x64.zip" -Force
          ./.github/check-package.ps1 -Zip "dist/win11/PowderGame-win11-x64.zip" -Exe $exe.FullName -Expected "README.txt", "powder_game.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowderGame-win11-x64
          path: dist/win11/PowderGame-win11-x64.zip
